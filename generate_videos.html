let selected = new Set();
let isGenerating = false;
const imgCache = {};

function log(msg, type) {
  const panel = document.getElementById('status-panel');
  const div = document.createElement('div');
  div.className = 'log' + (type ? ' ' + type : '');
  div.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
  panel.appendChild(div);
  panel.scrollTop = panel.scrollHeight;
}

function updateProgress(done, total) {
  document.getElementById('progress-bar').style.width = ((done / total) * 100) + '%';
}

function preloadImage(src) {
  return new Promise(function(resolve) {
    if (!src) { resolve(null); return; }
    if (imgCache[src]) { resolve(imgCache[src]); return; }
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function() { imgCache[src] = img; resolve(img); };
    img.onerror = function() { resolve(null); };
    img.src = src;
  });
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function formatTimecode(t) {
  var m = Math.floor(t / 60);
  var s = Math.floor(t % 60);
  var f = Math.floor((t % 1) * 30);
  return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s + ':' + (f < 10 ? '0' : '') + f;
}

function drawRobotArt(ctx, task, t, W, H) {
  var cx = W / 2, cy = H / 2 - 20;
  var orb = ctx.createRadialGradient(cx, cy, 0, cx, cy, 220);
  orb.addColorStop(0, task.color1 + '33');
  orb.addColorStop(0.5, task.color2 + '15');
  orb.addColorStop(1, 'transparent');
  ctx.fillStyle = orb;
  ctx.fillRect(0, 0, W, H);

  for (var r = 0; r < 3; r++) {
    var radius = 100 + r * 60 + Math.sin(t * 1.5 + r) * 10;
    ctx.save();
    ctx.globalAlpha = 0.18 - r * 0.04;
    ctx.strokeStyle = task.color1;
    ctx.lineWidth = 1.5;
    ctx.setLineDash([8, 12]);
    ctx.lineDashOffset = -t * 30;
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(Math.sin(t * 1.2) * 0.1);
  var armGrad = ctx.createLinearGradient(-30, -120, 30, 0);
  armGrad.addColorStop(0, task.color1 + 'cc');
  armGrad.addColorStop(1, task.color2 + '88');
  ctx.fillStyle = armGrad;
  ctx.shadowColor = task.color1;
  ctx.shadowBlur = 20;
  roundRect(ctx, -20, -130, 40, 90, 8);
  ctx.fill();
  ctx.rotate(0.3 + Math.sin(t * 1.5) * 0.1);
  ctx.fillStyle = armGrad;
  roundRect(ctx, -15, -10, 30, 80, 6);
  ctx.fill();
  ctx.translate(0, 75);
  var gripOpen = 20 + Math.sin(t * 2) * 8;
  ctx.fillStyle = '#e0e8ff';
  ctx.shadowColor = '#ffffff';
  ctx.shadowBlur = 10;
  roundRect(ctx, -gripOpen - 8, 0, 18, 35, 4);
  ctx.fill();
  roundRect(ctx, gripOpen - 10, 0, 18, 35, 4);
  ctx.fill();
  roundRect(ctx, -20, -15, 40, 20, 5);
  ctx.fill();
  ctx.restore();

  ctx.save();
  for (var i = 0; i < 12; i++) {
    var angle = (i / 12) * Math.PI * 2 + t * 0.5;
    var dist = 160 + Math.sin(t + i) * 20;
    var px = cx + Math.cos(angle) * dist;
    var py = cy + Math.sin(angle) * dist * 0.6;
    ctx.globalAlpha = 0.3 + 0.3 * Math.sin(t * 2 + i);
    ctx.fillStyle = task.color1;
    ctx.beginPath();
    ctx.arc(px, py, 3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawFrame(ctx, task, t, img) {
  var W = 800, H = 600;
  ctx.clearRect(0, 0, W, H);

  var bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, '#050508');
  bg.addColorStop(0.5, '#0a0a18');
  bg.addColorStop(1, '#050508');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.globalAlpha = 0.06 + 0.03 * Math.sin(t * 2);
  ctx.strokeStyle = task.color1;
  ctx.lineWidth = 1;
  for (var gx = 0; gx < W; gx += 40) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke(); }
  for (var gy = 0; gy < H; gy += 40) { ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke(); }
  ctx.restore();

  if (img) {
    var scale = Math.max(W / img.width, H / img.height);
    var sw = img.width * scale, sh = img.height * scale;
    var sx = (W - sw) / 2, sy = (H - sh) / 2;
    ctx.save();
    ctx.globalAlpha = 0.75;
    ctx.drawImage(img, sx, sy, sw, sh);
    ctx.restore();
    var ov = ctx.createLinearGradient(0, 0, 0, H);
    ov.addColorStop(0, 'rgba(5,5,15,0.5)');
    ov.addColorStop(0.5, 'rgba(5,5,15,0.1)');
    ov.addColorStop(1, 'rgba(5,5,15,0.85)');
    ctx.fillStyle = ov;
    ctx.fillRect(0, 0, W, H);
  } else {
    drawRobotArt(ctx, task, t, W, H);
  }

  ctx.save();
  ctx.globalAlpha = 0.04;
  for (var sy2 = 0; sy2 < H; sy2 += 3) {
    ctx.fillStyle = sy2 % 6 === 0 ? '#000' : '#fff';
    ctx.fillRect(0, sy2, W, 1);
  }
  ctx.restore();

  var bLen = 30, bW = 3;
  ctx.strokeStyle = task.color1;
  ctx.lineWidth = bW;
  ctx.beginPath(); ctx.moveTo(15, 15+bLen); ctx.lineTo(15, 15); ctx.lineTo(15+bLen, 15); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W-15-bLen, 15); ctx.lineTo(W-15, 15); ctx.lineTo(W-15, 15+bLen); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(15, H-15-bLen); ctx.lineTo(15, H-15); ctx.lineTo(15+bLen, H-15); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W-15-bLen, H-15); ctx.lineTo(W-15, H-15); ctx.lineTo(W-15, H-15-bLen); ctx.stroke();

  var numAlpha = Math.min(1, t * 3);
  ctx.save();
  ctx.globalAlpha = numAlpha;
  ctx.font = 'bold 52px Orbitron, monospace';
  ctx.fillStyle = task.color1;
  ctx.shadowColor = task.color1;
  ctx.shadowBlur = 20;
  ctx.textAlign = 'left';
  ctx.fillText(String(task.num).padStart(2, '0'), 25, 100);
  ctx.restore();

  var recX = W - 95, recY = 38;
  var recBlink = Math.floor(t * 2) % 2 === 0;
  ctx.save();
  if (recBlink) {
    ctx.fillStyle = '#ff2244';
    ctx.shadowColor = '#ff2244';
    ctx.shadowBlur = 15;
    ctx.beginPath(); ctx.arc(recX - 30, recY, 7, 0, Math.PI * 2); ctx.fill();
  }
  ctx.font = 'bold 18px Orbitron, monospace';
  ctx.fillStyle = recBlink ? '#ff2244' : '#cc1133';
  ctx.shadowBlur = 0;
  ctx.textAlign = 'left';
  ctx.fillText('REC', recX - 18, recY + 6);
  ctx.restore();

  ctx.save();
  ctx.font = '13px Orbitron, monospace';
  ctx.fillStyle = 'rgba(200,200,255,0.6)';
  ctx.textAlign = 'left';
  ctx.fillText(formatTimecode(t), 22, H - 22);
  ctx.restore();

  var footerGrad = ctx.createLinearGradient(0, H - 160, 0, H);
  footerGrad.addColorStop(0, 'rgba(0,0,0,0)');
  footerGrad.addColorStop(1, 'rgba(0,0,0,0.92)');
  ctx.fillStyle = footerGrad;
  ctx.fillRect(0, H - 160, W, 160);

  ctx.save();
  var lineGrad = ctx.createLinearGradient(0, 0, W, 0);
  lineGrad.addColorStop(0, 'transparent');
  lineGrad.addColorStop(0.2, task.color1);
  lineGrad.addColorStop(0.8, task.color2);
  lineGrad.addColorStop(1, 'transparent');
  ctx.strokeStyle = lineGrad;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, H - 110); ctx.lineTo(W, H - 110); ctx.stroke();
  ctx.restore();

  var titleProgress = Math.min(1, Math.max(0, (t - 0.3) * 2.5));
  var eased = 1 - Math.pow(1 - titleProgress, 3);
  var lines = task.label.split('\n');

  ctx.save();
  ctx.globalAlpha = eased;
  ctx.font = 'bold ' + (lines.length > 1 ? 38 : 44) + 'px Orbitron, monospace';
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = task.color1;
  ctx.shadowBlur = 25;
  ctx.textAlign = 'left';
  if (lines.length === 1) {
    ctx.fillText(lines[0], 22, H - 60);
  } else {
    ctx.fillText(lines[0], 22, H - 80);
    ctx.fillText(lines[1], 22, H - 42);
  }
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = eased * 0.7;
  ctx.font = '13px Inter, sans-serif';
  ctx.fillStyle = task.color1;
  ctx.textAlign = 'left';
  ctx.fillText('ROBOT MANIPULATION', 22, H - 16);
  ctx.restore();
}

function generateVideo(task) {
  return new Promise(function(resolve) {
    preloadImage(task.img).then(function(img) {
      var canvas = document.getElementById('main-canvas');
      var ctx = canvas.getContext('2d');
      var fps = 30;
      var duration = 6;
      var totalFrames = fps * duration;
      var stream = canvas.captureStream(fps);
      var recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 8000000 });
      var chunks = [];
      recorder.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = function() {
        var blob = new Blob(chunks, { type: 'video/webm' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = task.file + '.webm';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function() { URL.revokeObjectURL(url); }, 2000);
        resolve();
      };
      recorder.start();
      var frame = 0;
      function renderFrame() {
        if (frame >= totalFrames) { recorder.stop(); return; }
        drawFrame(ctx, task, frame / fps, img);
        frame++;
        setTimeout(renderFrame, 1000 / fps);
      }
      renderFrame();
    });
  });
}

function buildGrid() {
  var grid = document.getElementById('task-grid');
  grid.innerHTML = '';
  TASKS.forEach(function(task) {
    var card = document.createElement('div');
    card.className = 'thumb-card';
    card.id = 'card-' + task.num;
    card.onclick = function() { toggleSelect(task.num); };
    card.innerHTML =
      '<div class="preview"><canvas id="prev-' + task.num + '" width="200" height="150"></canvas></div>' +
      '<div class="info">' +
        '<div class="task-num"><span class="status-dot" id="dot-' + task.num + '"></span>TASK ' + String(task.num).padStart(2,'0') + '</div>' +
        '<div class="task-name">' + task.label.replace('\n', ' ') + '</div>' +
      '</div>';
    grid.appendChild(card);
  });
  TASKS.forEach(function(task) {
    var pCanvas = document.getElementById('prev-' + task.num);
    var pCtx = pCanvas.getContext('2d');
    preloadImage(task.img).then(function(img) {
      pCtx.save();
      pCtx.scale(200/800, 150/600);
      drawFrame(pCtx, task, 1.5, img);
      pCtx.restore();
    });
  });
}

function toggleSelect(num) {
  if (selected.has(num)) { selected.delete(num); document.getElementById('card-' + num).classList.remove('ready'); }
  else { selected.add(num); document.getElementById('card-' + num).classList.add('ready'); }
  document.getElementById('btn-gen-selected').disabled = selected.size === 0;
}

function selectAll() {
  TASKS.forEach(function(t) { selected.add(t.num); document.getElementById('card-' + t.num).classList.add('ready'); });
  document.getElementById('btn-gen-selected').disabled = false;
}

function clearSelection() {
  TASKS.forEach(function(t) { selected.delete(t.num); document.getElementById('card-' + t.num).classList.remove('ready'); });
  document.getElementById('btn-gen-selected').disabled = true;
}

async function generateAll() {
  if (isGenerating) return;
  await runGeneration(TASKS);
}

async function generateSelected() {
  if (isGenerating) return;
  var toGen = TASKS.filter(function(t) { return selected.has(t.num); });
  await runGeneration(toGen);
}

async function runGeneration(tasks) {
  isGenerating = true;
  document.getElementById('btn-generate-all').disabled = true;
  document.getElementById('btn-gen-selected').disabled = true;
  log('Starting generation of ' + tasks.length + ' videos...', 'active');

  for (var i = 0; i < tasks.length; i++) {
    var task = tasks[i];
    var card = document.getElementById('card-' + task.num);
    card.classList.add('recording');
    log('Recording Task ' + String(task.num).padStart(2,'0') + ': ' + task.label.replace('\n', ' ') + '...', 'active');
    await generateVideo(task);
    await new Promise(function(r) { setTimeout(r, 500); });
    card.classList.remove('recording');
    card.classList.add('done');
    document.getElementById('dot-' + task.num).style.cssText = 'background:#a855f7;animation:none';
    log('Saved: ' + task.file + '.webm', 'success');
    updateProgress(i + 1, tasks.length);
  }

  log('All ' + tasks.length + ' videos generated! Check your Downloads folder.', 'success');
  isGenerating = false;
  document.getElementById('btn-generate-all').disabled = false;
}

buildGrid();
log('Grid loaded. Tasks 01-12 use existing photorealistic images.', 'success');
log('Tasks 13-42 use procedural animated robot art.', '');
</script>
